<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Sign in to Domek</title>
</head>
<body style="margin:0;padding:0;background:#f4f1ea;font-family:Georgia,serif;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="padding:40px 16px;">
    <tr>
      <td align="center">
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:480px;background:#fdfcf8;border:1px solid #dfddd6;border-radius:8px;padding:40px 36px;">
          <tr>
            <td>
              <p style="margin:0 0 4px;font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:#c85b45;">Domek</p>
              <h1 style="margin:0 0 20px;font-size:22px;font-weight:600;color:#171a18;">Your sign-in link is ready</h1>
              <p style="margin:0 0 28px;font-size:14px;line-height:1.6;color:#4d5451;">
                Use this secure link to sign in to Domek and pick up where you left off.
              </p>
              <a href="{{ .ConfirmationURL }}" style="display:inline-block;padding:12px 24px;background:#232323;color:#fdfcf8;text-decoration:none;border-radius:6px;font-size:14px;font-weight:600;font-family:Georgia,serif;">
                Sign in to Domek
              </a>
              <p style="margin:28px 0 0;font-size:12px;line-height:1.6;color:#9a9e9b;">
                If you did not request this, you can safely ignore this email.
              </p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
