services:
  app:
    container_name: domek-web
    image: ${DOMEK_IMAGE:-ghcr.io/davidlesicnik/domek:latest}
    pull_policy: always
    env_file:
      - .env
    restart: unless-stopped
    networks:
      - default
      - proxy
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    container_name: domek-postgres
    image: postgres:17-alpine
    env_file:
      - .env
    restart: unless-stopped
    networks:
      - default
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - postgres-data:/var/lib/postgresql/data

  scheduler:
    container_name: domek-scheduler
    image: curlimages/curl:8.14.1
    env_file:
      - .env
    restart: unless-stopped
    networks:
      - default
    depends_on:
      app:
        condition: service_started
    command:
      - sh
      - -c
      - |
        sleep 15
        while true; do
          curl -fsS -X POST http://app:3000/api/notify/send -H "Authorization: Bearer $$NOTIFY_SECRET" || true
          sleep "$$NOTIFY_INTERVAL_SECONDS"
        done

volumes:
  postgres-data:

networks:
  proxy:
    external: true