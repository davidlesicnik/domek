services:
  db-backup:
    build:
      context: .
      dockerfile: Dockerfile.backup
    image: domek-db-backup
    env_file:
      - ${BACKUP_ENV_FILE:?Set BACKUP_ENV_FILE to the backup runtime env file.}
    volumes:
      - ${BACKUP_DESTINATION_DIR:?Set BACKUP_DESTINATION_DIR to the NAS backup path.}:/backup
      - ${RESTIC_PASSWORD_FILE_PATH:?Set RESTIC_PASSWORD_FILE_PATH to the restic password file path.}:/etc/domek/restic-password:ro
